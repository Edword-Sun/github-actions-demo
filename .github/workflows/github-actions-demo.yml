name: CI/CD Pipeline
on:
  push:
    branches: [ dev ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ed-environment
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/github-actions-demo:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: DOCKER_USERNAME
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }} # 改用密码认证
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/github-actions-demo:latest
            docker stop github-actions-demo || true
            docker rm github-actions-demo || true
            docker run -d --name github-actions-demo ${{ secrets.DOCKER_USERNAME }}/github-actions-demo:latest
