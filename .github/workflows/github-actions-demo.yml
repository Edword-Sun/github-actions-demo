name: CI/CD Pipeline
on:
  push:
    branches: [ dev ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: DOCKER_USERNAME # 在这里指定你的环境名称
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          # username: ${{ secrets.DOCKER_USERNAME }}
          # password: xxxx
          username: edwordddddddddd
          password: dckr_pat__AJ5klfX0AspqannVGjh-64FP2o

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # tags: ${{ secrets.DOCKER_USERNAME }}/github-actions-demo:latest
          tags: edwordddddddddd/github-actions-demo:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: DOCKER_USERNAME # 同样指向你的环境名称
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # docker pull ${{ secrets.DOCKER_USERNAME }}/github-actions-demo:latest
            docker pull edwordddddddddd/github-actions-demo:latest
            docker stop github-actions-demo || true
            docker rm github-actions-demo || true
            # docker run -d --name github-actions-demo ${{ secrets.DOCKER_USERNAME }}/github-actions-demo:latest
            docker run -d --name github-actions-demo edwordddddddddd/github-actions-demo:latest
